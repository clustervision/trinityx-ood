<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ table }} — Error</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    .alert { padding: 1rem 1.25rem; background: #f8d7da; color: #721c24; border-radius: 6px; max-width: 48rem; }
  </style>
</head>
<body>
  <h1>{{ table }}</h1>
  {% if error %}
  <div class="alert" role="alert">{{ error | safe }}</div>
  {% endif %}
</body>
</html>
