# Status: Production
# copyright: Copyright 2026, Luna2 Project
# license: GPL
#
# Build and publish the pip package. The build/publish logic lives once in
# ClusterVision/gitlab-cicd-pipelines rather than being copied into every project:
# it also points the target directory's "latest" symlinks at the build it just
# produced and prunes older ones, which the per-project version never did.
#
# Branch -> stream:  main -> $LOCATION,  development -> $DEV_LOCATION,
#                    ztp-poc -> $ZTPPOC_LOCATION (skipped where unset).
# Any other branch is built but not published.
#
# Required project CI/CD variables: LOCATION, DEV_LOCATION, IPADDRESS, SSH_USER,
# SSH_PASSWORD.
#

include:
  - project: 'ClusterVision/gitlab-cicd-pipelines'
    file: '/pip-package-pipeline.yml'
    ref: 'main'

# APP_STATE = False in an app's constant.py is development mode (see devserver.py).
# It runs in .pre so that a failure stops the build and the publish behind it.
app-state-check:
  stage: .pre
  image: python:3.10.0-alpine
  script:
    - |
      if grep -nE '^APP_STATE *= *False' */constant.py; then
        echo "APP_STATE = False is development mode; set it back to True before merging." >&2
        exit 1
      fi