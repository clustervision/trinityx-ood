stages:
  - production
  - development

variables:
  NODE_ENV: production
  BUILD_DIR: dist

production:
  stage: production
  image: node:18-alpine
  only:
    - main
  script:
    - npm ci
    - npm run build
    - apk add openssh-client sshpass
    - sshpass -p $SSH_PASSWORD scp -r -oStrictHostKeyChecking=no $BUILD_DIR/* $SSH_USER@$IPADDRESS:$LOCATION

development:
  stage: development
  image: node:18-alpine
  only:
    - development
  script:
    - npm ci
    - npm run build
    - apk add openssh-client sshpass
    - sshpass -p $SSH_PASSWORD scp -r -oStrictHostKeyChecking=no $BUILD_DIR/* $SSH_USER@$IPADDRESS:$DEV_LOCATION
