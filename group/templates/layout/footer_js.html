<div class="modal fade" id="logmodal" tabindex="-1" role="dialog" aria-labelledby="logmodalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="logmodalLabel">Status</h5>
          <div id="spinner" style="float: right; margin-right: -50%;"></div>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close" onClick="redirection();">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body" id="run-time-body">
            <pre id="run-time-logs"></pre>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal" onClick="redirection();" >Close</button>
        </div>
      </div>
    </div>
</div>


<script src="{{ url_for('static', filename='js/jquery-3.6.0.js') }}"></script>
<script src="{{ url_for('static', filename='js/jquery-ui.js') }}"></script>


<script>
    function toggleDHCP(checkbox) {
        const textInput = checkbox.nextElementSibling;
        if (textInput && textInput.type === "hidden") {
            textInput.value = checkbox.checked ? "true" : "false";
        }
    }
</script>

<script>
    $(function() {
        /* Skip forms that live inside the home-page modal (handled by group-app.js + fetch). */
        var $form = $('#formAuthentication').filter(function () {
            return $(this).closest('#groupModal').length === 0;
        });
        if (!$form.length) return;

        $form.submit(function (e) {
          var baseline = $form.data('gf-initial');
          if (baseline === undefined) baseline = '';
          if (baseline === $form.serialize()) {
            $('#form-status').html();
            $('#form-status').addClass("alert alert-danger");
            $('#form-status').html('Nothing is changed!');
          } else {
            var nnv = $('#id_newname').val();
            if (!nnv) nnv = $('#id_newgroupname').val();
            if ($('#id_name').val() && nnv){
                if ($('#id_name').val() == nnv){
                    $('#form-status').html();
                    $('#form-status').addClass("alert alert-danger");
                    $('#form-status').html('Both Name can not be same, Kindly choose a different name.');
                } else {
                  var el = $form.get(0);
                  if (el) HTMLFormElement.prototype.submit.call(el);
                }
            } else {
              var el2 = $form.get(0);
              if (el2) HTMLFormElement.prototype.submit.call(el2);
            }
          }
          e.preventDefault();
        });
    });

</script>
<script>
    
    if (document.getElementById('datatable') && !document.getElementById('groupTable')) {
        new DataTable('#datatable', {
            columnDefs: [
                { targets: 0, visible: false, searchable: false }
            ],
            /* Clear defaults, then: search above table (moved to header on home),
               pageLength + info + paging below table (see inventory extra_js). */
            layout: {
                topStart: null,
                topEnd: null,
                bottomStart: null,
                bottomEnd: null,
                top: ['search'],
                bottom: ['pageLength', 'info', 'paging']
            }
        });
    }


    function color_message(message=null){
        if  (message.includes('error') || message.includes('undefined') || message.includes('failed')){
            message = "<span style='color:red;'>" + message + "</span><br />";
        } else {
            message = "<span style='color:yellow;'>" + message + "</span><br />";
        }
        return message
    }


    function redirection(){
        if  (window.location.pathname.includes('/clone/')){
            redirect_path = window.location.pathname;
            redirect_path = redirect_path.replace('/clone/', '/edit/');
            window.location.href = redirect_path;
        } else if  (window.location.pathname.includes('/osgrab/') || window.location.pathname.includes('/ospush/')){
            redirect_path = window.location.pathname;
            window.location.href = redirect_path;
        } else if  (window.location.pathname.includes('/service/')){
            window.location.href = window.location.href;
        } else {
            $('#logmodal').modal('hide');
        }
    }


    function clone_osimage(request_id=null, message=null){
        $('#run-time-logs').empty();
        message = decodeURI(message);
        $(window).on('load', function() {
            $('#logmodal').modal('show');
        });
        var text = $('#run-time-logs').html();
        text += color_message(message);
        $('#run-time-logs').html(text);
        var run_time_div = document.getElementById("run-time-body");

        var url;
        if (typeof window.groupCheckStatusUrl === 'function') {
            url = window.groupCheckStatusUrl(request_id);
        } else {
            url = window.location.href
            url = url.replace(window.location.search,'');
            url = url.split('/');
            url.pop();
            url.pop();
            url = url.join("/");
            url = url+"/check_status/config/status/"+request_id;
        }

        var intervalId;
        intervalId = setInterval(function(){
            $.getJSON(url, function(data){
                if (data.message.includes("No data for this request")){
                    clearInterval(intervalId);
                } else {
                    text = $('#run-time-logs').html();
                    if  (data.message.length){
                        if  (data.message.includes(';;')){
                            const myArray = data.message.split(";;");
                            for (var i=0; i<myArray.length; i++) { text += color_message(myArray[i]); }
                        } else {
                            text += color_message(data.message);
                        }
                        $('#run-time-logs').html(text);
                    }
                    run_time_div.scrollTop = run_time_div.scrollHeight;
                }
            });
        }, 1000);
    }

    function member(table=null, record=null){
        $('#logmodalLabel').empty();
        $('#logmodalLabel').html('<span>Member Nodes Of '+table+' >> '+record+' </span>');
        $('#run-time-logs').empty();
        var memberUrl;
        if (window.GROUP_GET_LIST_ROOT !== undefined && window.GROUP_GET_LIST_ROOT !== null) {
            var root = String(window.GROUP_GET_LIST_ROOT).replace(/\/$/, '');
            memberUrl = (root ? root : '') + '/member/' + table + '/' + encodeURIComponent(record);
        } else {
            memberUrl = window.location.href+"/member/"+table+"/"+record;
        }
        $.ajax({
            url: memberUrl,
            type: 'GET',
            contentType: 'application/json; charset=UTF-8',
            dataType: 'json',
            success: function(request_data) {
                $('#logmodal').modal('show');
                var text = $('#run-time-logs').text();
                text += color_message(request_data);
                $('#run-time-logs').html(text);
            }
        });
    }


    function check_request_id(){
        var query_string = window.location.search;
        if (query_string.includes("request_id") && query_string.includes("message")){
            
            var query_string = query_string.substr(1).split('&');
            var params = {};
            for (var i = 0; i < query_string.length; i++) {
                var parts = query_string[i].split('=');
                params[parts[0]] = parts[1];
            }
            clone_osimage(params.request_id, params.message);
        }
    }
    check_request_id();
    
    function ucwords (str) {
        return (str + '').replace(/^([a-z])|\s+([a-z])/g, function ($1) {
            return $1.toUpperCase();
        });
    }

    function get_list(table, select){
        var options = '';
        var url;
        if (window.GROUP_GET_LIST_ROOT !== undefined && window.GROUP_GET_LIST_ROOT !== null) {
            var root = String(window.GROUP_GET_LIST_ROOT).replace(/\/$/, '');
            url = (root ? root : '') + '/get_list/' + table;
        } else {
            url = window.location.href;
            url = url.replace(window.location.search,'');
            if  (url.includes('/edit/') || url.includes('/clone/')){
                url = url.split('/');
                url.pop();
                url.pop();
                url = url.join("/");
            } else {
                url = url.split('/');
                url.pop();
                url = url.join("/");
            }
            url = url+"/get_list/"+table;
        }
        $.ajax({
            async: false,
            global: false,
            url: url,
            type: 'GET',
            dataType: 'json',
            success: function(res) {
                options += '<select name="'+table+'" id="id_'+table+'">';
                for (var i=0; i<res.length; i++) {
                    if (select == res[i][0]){
                        options += '<option value="'+res[i][0]+'" selected>'+res[i][1]+'</option>';
                    } else {
                        options += '<option value="'+res[i][0]+'">'+res[i][1]+'</option>';
                    }
                }
                options += '</select>';
            }
        });
        return options;
    }

    /* Group form: network/bond lists + interface rows from JSON API (not server HTML) */
    var GROUP_NET_LIST = { options: [], selected: null };
    var GROUP_BOND_MODES = [];
    var DEFAULT_BOND_MODES = ['balance-rr', 'active-backup', 'balance-xor', 'broadcast', '802.3ad', 'balance-tlb', 'balance-alb'];

    function gfAttr(s) {
      if (s == null) return '';
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }
    var gfEscapeHtml = gfAttr;

    function fillGroupSelect($sel, listObj, emptyLabel) {
      if (!$sel || !$sel.length) return;
      var opts = (listObj && listObj.options) ? listObj.options : [];
      var selected = listObj && listObj.selected != null && listObj.selected !== '' ? String(listObj.selected) : '';
      $sel.empty();
      $sel.append($('<option></option>').val('').text(emptyLabel || '---'));
      opts.forEach(function (name) {
        var o = $('<option></option>').val(name).text(name);
        if (String(name) === selected) o.prop('selected', true);
        $sel.append(o);
      });
    }

    function networkSelectHtml(selectedVal) {
      var opts = GROUP_NET_LIST.options || [];
      var html = '<div class="tx-field tx-field-orange"><span class="tx-label">Network:</span><select name="network" class="form-control">';
      html += '<option value="">Select Network</option>';
      var sel = selectedVal != null ? String(selectedVal) : '';
      for (var i = 0; i < opts.length; i++) {
        var n = opts[i];
        var isSel = String(n) === sel ? ' selected' : '';
        html += '<option value="' + gfAttr(n) + '"' + isSel + '>' + gfAttr(n) + '</option>';
      }
      html += '</select></div>';
      return html;
    }

    function bondSelectHtml(selectedVal) {
      var modes = (GROUP_BOND_MODES && GROUP_BOND_MODES.length) ? GROUP_BOND_MODES : DEFAULT_BOND_MODES;
      var html = '<div class="tx-field tx-field-orange"><span class="tx-label">Bond Mode:</span><select name="bond_mode" class="form-control">';
      html += '<option value="">--- Select Bond Mode ---</option>';
      var sel = selectedVal != null ? String(selectedVal) : '';
      for (var i = 0; i < modes.length; i++) {
        var m = modes[i];
        var isSel = String(m) === sel ? ' selected' : '';
        html += '<option value="' + gfAttr(m) + '"' + isSel + '>' + gfAttr(m) + '</option>';
      }
      html += '</select></div>';
      return html;
    }

    function appendGroupInterfaceRowString(iface) {
      iface = iface || {};
      var val = function (k) {
        if (iface[k] == null || iface[k] === '') return '';
        return String(iface[k]);
      };
      var dhcpOn = iface.dhcp === true || iface.dhcp === 'True';
      var dhcpHidden = dhcpOn ? 'true' : 'false';
      var dhcpChecked = dhcpOn ? ' checked' : '';

      return (
        '<div class="tx-interface-block">' +
          '<div class="tx-iface-grid">' +
            '<div class="tx-field tx-field-orange"><span class="tx-label">Interface:</span><input type="text" name="interface" required placeholder="interface" value="' + gfAttr(val('interface')) + '" /></div>' +
            networkSelectHtml(iface.network) +
            '<div class="tx-field tx-field-orange"><span class="tx-label">MTU:</span><input type="number" name="mtu" min="68" max="65535" placeholder="68-65535" value="' + gfAttr(val('mtu')) + '" /></div>' +
            '<div class="tx-field tx-field-orange"><span class="tx-label">DHCP</span>' +
              '<input type="checkbox" class="form-check-input"' + dhcpChecked + ' onclick="toggleDHCP(this)" />' +
              '<input type="hidden" name="dhcp" value="' + dhcpHidden + '" /></div>' +
          '</div>' +
          '<div class="tx-iface-grid">' +
            bondSelectHtml(iface.bond_mode) +
            '<div class="tx-field tx-field-orange"><span class="tx-label">Bond Member:</span><input type="text" name="bond_slaves" placeholder="Bond Member Interfaces" value="' + gfAttr(val('bond_slaves')) + '" /></div>' +
            '<div class="tx-field tx-field-orange"><span class="tx-label">VLAN ID:</span><input type="number" name="vlanid" min="0" max="4094" placeholder="VLAN ID" value="' + gfAttr(val('vlanid')) + '" /></div>' +
          '</div>' +
          '<div class="tx-iface-grid">' +
            '<div class="tx-field tx-field-orange"><span class="tx-label">Options:</span><input type="text" name="options" placeholder="options" maxlength="100" value="' + gfAttr(val('options')) + '" /></div>' +
            '<div class="tx-field tx-field-orange"><span class="tx-label">VLAN Parent:</span><input type="text" name="vlan_parent" placeholder="VLAN Parent" value="' + gfAttr(val('vlan_parent')) + '" /></div>' +
          '</div>' +
          '<div class="tx-interface-actions">' +
            '<button type="button" class="tx-btn tx-btn-dark js-remove-interface">Remove Interface</button>' +
            '<button type="button" class="tx-btn tx-btn-orange js-add-interface">+ Add</button>' +
          '</div>' +
        '</div>'
      );
    }

    var group_interface = appendGroupInterfaceRowString(null);
    window.appendGroupInterfaceRowString = appendGroupInterfaceRowString;
    window.group_interface = group_interface;

    function gfBool(v) {
      return v === true || v === 'True';
    }

    function gfTriValue(v) {
      if (v === true || v === 'True' || v === 'true') return 'true';
      if (v === false || v === 'False' || v === 'false') return 'false';
      return '';
    }

    function setTriFieldState($field, valueAttr) {
      if (!$field || !$field.length) return;
      var v = valueAttr === 'true' || valueAttr === 'false' ? valueAttr : '';
      var $inp = $field.find('input[type="hidden"]').first();
      if ($inp.length) $inp.val(v);
      $field.find('.tx-seg').removeClass('is-active');
      $field.find('.tx-seg').each(function () {
        if (($(this).attr('data-v') || '') === v) $(this).addClass('is-active');
      });
    }

    $('body').on('click', '.tx-tri-field .tx-seg', function (e) {
      e.preventDefault();
      var $f = $(this).closest('.tx-tri-field');
      var raw = $(this).attr('data-v');
      if (raw === 'true' || raw === 'false') setTriFieldState($f, raw);
      else setTriFieldState($f, '');
    });

    function hydrateGroupAdvTextarea(prefix, d) {
      var s1 = d[prefix + '_source'] || '';
      var s2 = d['_' + prefix + '_source'] || '';
      var inherited = (s1 && s1 !== 'group') || (s2 && s2 !== 'group');
      var $block = $('[data-gf-adv="' + prefix + '"]');
      if (!$block.length) return;
      $block.find('.js-' + prefix + '-s1').text(s1 || '');
      $block.find('.js-' + prefix + '-s2').text(s2 || '');
      var $ro = $block.find('.js-' + prefix + '-ro');
      var $ed = $block.find('textarea[name="' + prefix + '"]');
      var valMain = d[prefix] != null ? String(d[prefix]) : '';
      $ro.hide().val('');
      $ed.val('');
      if (inherited) {
        $ro.show().val(valMain);
      } else {
        $ed.val(valMain);
      }
    }

    function hydrateGroupProvisionField(name, d) {
      var src1 = d[name + '_source'] || '';
      var src2 = d['_' + name + '_source'] || '';
      var hint = (src1 || src2) ? ('| ' + src1 + src2) : '';
      var $inp = $('[name="' + name + '"]');
      $('.js-' + name + '-hint').text(hint);
      var ok = (src1 === 'group' || src2 === 'group' || (!src1 && !src2));
      var val = d[name] != null ? String(d[name]) : '';
      if (name === 'provision_interface' || name === 'provision_fallback' || name === 'provision_method') {
        $inp.val(ok ? val : '');
      }
    }

    function hydrateOspushForm(payload) {
      var d = payload.data || {};
      var $name = $('#id_ospush_name');
      var $os = $('#id_ospush_osimage');
      if ($name.length) {
        fillGroupSelect($name, payload.group_list, 'Select Group');
      }
      if ($os.length) {
        fillGroupSelect($os, payload.osimage_list, 'Select Osimage');
      }
      $('.js-gf-record-title').text(payload.record || d.name || '');
    }

    function hydrateGroupFormBody(payload) {
      var $pageShell = $('#groupModal .tx-shell[data-group-page]');
      if (!$pageShell.length) $pageShell = $('.tx-shell[data-group-page]').first();
      var page = $pageShell.data('group-page');
      if (page === 'ospush') {
        hydrateOspushForm(payload);
        return;
      }
      var d = payload.data || {};
      if (page === 'edit' || page === 'clone') {
        if (!d.name) {
          $('#group-form-error').text('This group is not available at this moment.').show();
          $('#group-form-body').hide();
          return;
        }
      }
      $('#group-form-error').hide();
      $('#group-form-body').show();
      $('.js-gf-record-title').text(payload.record || d.name || '');

      $('#id_name').val(d.name || '');
      if ($('#id_newgroupname').length) $('#id_newgroupname').val(d.newgroupname != null ? d.newgroupname : '');
      fillGroupSelect($('#id_bmcsetupname'), payload.bmcsetup_list, 'Select Bmcsetup');
      fillGroupSelect($('#id_osimage'), payload.osimage_list, 'Select Osimage');
      var $sbTri = $('#id_setupbmc').closest('.tx-tri-field');
      if ($sbTri.length) setTriFieldState($sbTri, gfTriValue(d.setupbmc));
      else $('#id_setupbmc').prop('checked', gfBool(d.setupbmc));
      $('#id_roles').val(d.roles != null ? d.roles : '');
      $('#id_scripts').val(d.scripts != null ? d.scripts : '');
      var $nbTri = $('#id_netboot').closest('.tx-tri-field');
      if ($nbTri.length) setTriFieldState($nbTri, gfTriValue(d.netboot));
      else $('#id_netboot').prop('checked', gfBool(d.netboot));
      $('#id_bootmenu').prop('checked', gfBool(d.bootmenu));

      $('#id_domain').val(d.domain != null ? d.domain : '');
      $('#id_unmanaged_bmc_users').val(d.unmanaged_bmc_users != null ? d.unmanaged_bmc_users : '');
      hydrateGroupAdvTextarea('kerneloptions', d);
      hydrateGroupAdvTextarea('prescript', d);
      hydrateGroupAdvTextarea('partscript', d);
      hydrateGroupAdvTextarea('postscript', d);

      var otag = d.osimagetag != null && d.osimagetag !== 'default' ? d.osimagetag : '';
      $('#id_osimagetag').val(otag);
      var osl = '';
      if (d.osimagetag_source || d._osimagetag_source) {
        osl = '| ' + (d.osimagetag_source || '') + (d._osimagetag_source || '');
      }
      $('.js-osimagetag-hint').text(osl);

      hydrateGroupProvisionField('provision_interface', d);
      hydrateGroupProvisionField('provision_fallback', d);
      hydrateGroupProvisionField('provision_method', d);

      $('#id_comment').val(d.comment != null ? d.comment : '');

      GROUP_NET_LIST = payload.network_list || { options: [], selected: null };
      GROUP_BOND_MODES = payload.bond_modes || [];
      group_interface = appendGroupInterfaceRowString(null);
      window.group_interface = group_interface;

      var $rows = $('#group-interface-rows');
      $rows.empty();
      var ifaces = d.interfaces || [];
      if (Array.isArray(ifaces) && ifaces.length) {
        ifaces.forEach(function (row) {
          $rows.append(appendGroupInterfaceRowString(row));
        });
      }
      $('#interface_section').hide();
      var $ti2 = $('#toggle_interfaces');
      if ($ti2.length) $ti2.text('+ Interfaces');
    }

    function resetGroupFormSerializedBaseline() {
      var $form = $('#formAuthentication');
      if ($form.length) $form.data('gf-initial', $form.serialize());
    }

    window.hydrateGroupFormBody = hydrateGroupFormBody;
    window.resetGroupFormSerializedBaseline = resetGroupFormSerializedBaseline;
    window.fillGroupSelect = fillGroupSelect;
    window.setTriFieldState = setTriFieldState;
    window.gfTriValue = gfTriValue;

    $(function () {
      var $shell = $('.tx-shell[data-group-page]').filter(function () {
        return $(this).closest('#groupModal').length === 0;
      });
      if (!$shell.length) return;
      $('#group-form-loading').show();
      var base = window.location.href.split('?')[0];
      var url = base + (base.indexOf('?') >= 0 ? '&' : '?') + 'format=json';
      $.getJSON(url, function (payload) {
        $('#group-form-loading').hide();
        hydrateGroupFormBody(payload);
        resetGroupFormSerializedBaseline();
      }).fail(function (xhr) {
        $('#group-form-loading').hide();
        var msg = 'Failed to load form data.';
        try {
          var j = JSON.parse(xhr.responseText);
          if (j && j.error) msg = j.error;
        } catch (e) {}
        $('#group-form-error').text(msg).show();
      });
    });

    $('body').on('click', '.js-add-interface', function () {
        $(this).closest('.tx-interface-block').after(appendGroupInterfaceRowString(null));
    });

    $('body').on('blur', "input[name='mtu']", function () {
      var value = parseInt(this.value, 10);
      if (!isNaN(value)) {
        if (value < 68) this.value = 68;
        if (value > 65535) this.value = 65535;
      }
    });


    function remove_interface(node, interface){
        var response = {};
        var url;
        if ($('#formAuthentication').data('gf-remove-prefix') !== undefined) {
            var prefix = $('#formAuthentication').data('gf-remove-prefix');
            prefix = prefix == null ? '' : String(prefix).replace(/\/$/, '');
            url = (prefix ? prefix : '') + '/remove/' + encodeURIComponent(node) + '/' + encodeURIComponent(interface);
        } else {
            url = window.location.href.replace(window.location.search, '');
            url = url.split('/');
            url.pop();
            if (url.includes('edit') || url.includes('clone')) {
                url.pop();
            }
            url = url.join('/');
            url = url + '/remove/' + encodeURIComponent(node) + '/' + encodeURIComponent(interface);
        }
        $.ajax({
            async: false,
            global: false,
            url: url,
            type: 'GET',
            dataType: 'json',
            complete: function (xhr) {
                try {
                    response = xhr.responseJSON || JSON.parse(xhr.responseText || '{}');
                } catch (e) {
                    response = { message: xhr.responseText || 'Request failed', status: 'error' };
                }
            }
        });
        return response;
    }

    function gfRemoveMsg(res) {
        if (!res) return '';
        if (res.message) return res.message;
        if (res.success) return res.success;
        if (res.error) return res.error;
        return '';
    }

    function gfRemoveOk(res) {
        if (!res) return false;
        if (res.status === 'success') return true;
        if (res.success) return true;
        return false;
    }

     $('body').on('click', '#remove_nodeinterface, .js-remove-interface', function() {
        var $block = $(this).closest('.tx-interface-block');
        var node = $('#formAuthentication').data('gf-record');
        if (!node) {
            var path = window.location.pathname.replace(/\/$/, '').split('/');
            node = path[path.length - 1];
        }

        if ($block.length) {
            var iface = $block.find('input[name="interface"]').val();
            if (iface) {
                var response = remove_interface(node, iface);
                if (!gfRemoveOk(response)) {
                    $block.after('<div class="alert alert-danger" role="alert">' + gfEscapeHtml(gfRemoveMsg(response)) + '</div>');
                } else {
                    $block.after('<div class="alert alert-success" role="alert">' + gfEscapeHtml(gfRemoveMsg(response)) + '</div>');
                    $block.remove();
                }
            } else {
                $block.remove();
            }
        } else {
            var iface = $(this).parent().prev().find('input[type="text"]').val();
            if (iface) {
                var response = remove_interface(node, iface);
                if (!gfRemoveOk(response)) {
                    $(this).parent().after('<br /><div class="input-group"><p class="alert alert-danger" role="alert">' + gfEscapeHtml(gfRemoveMsg(response)) + '</p></div>');
                } else {
                    $(this).parent().after('<br /><div class="input-group"><p class="alert alert-success" role="alert">' + gfEscapeHtml(gfRemoveMsg(response)) + '</p></div>');
                    $(this).parent().prev().remove();
                    $(this).parent().remove();
                }
            } else {
                $(this).parent().prev().remove();
                $(this).parent().remove();
            }
        }
     });

</script>
