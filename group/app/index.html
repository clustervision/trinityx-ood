 Frontend wiring:
  - window.APP_URL     → Group API on port 7755 (same hostname as the request).
  - window.CONTEXT_URL → OOD / gateway on port 8080 — for logo and home page links only.

  Local `npm run dev`: set both in group/frontend/index.html (7755 + 8080 on your VM).
-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group :: Luna</title>
    <script type="module" crossorigin src="{{ url_for('static', filename='index.js') }}"></script>
    <link rel="stylesheet" crossorigin href="{{ url_for('static', filename='index.css') }}" />
    <script>
      window.APP_URL = "{{ APP_URL }}";
      window.CONTEXT_URL = "{{ CONTEXT_URL }}";
    </script>

  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
