<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group :: Luna (dev)</title>
    <link rel="stylesheet" href="/static/vendor/fontsource-geist-sans/index.css" />
    <link rel="stylesheet" href="/static/vendor/fontsource-geist-sans/500.css" />
    <link rel="stylesheet" href="/static/vendor/fontsource-geist-sans/700.css" />
    <!--
      VM: run python app.py (binds 0.0.0.0:7755).
      Laptop: npm run dev — set VITE_GROUP_BACKEND in .env.development to that VM URL.
      Leave APP_URL empty so /api/* is proxied by Vite (avoids browser CORS and cert issues).
      For direct browser→VM calls instead, set APP_URL to the full backend URL and fix CORS + TLS in the browser.
    -->
    <script>
      window.APP_URL = "{{ APP_URL }}";
    </script>
    <script type="module" crossorigin src="/index.js"></script>
    <link rel="stylesheet" crossorigin href="/index.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
