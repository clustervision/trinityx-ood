<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group :: Luna (dev)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/index.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/500.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.2.5/700.css" crossorigin="anonymous" />
    <!--
      VM: run python app.py (binds 0.0.0.0:7755).
      Laptop: npm run dev — set VITE_GROUP_BACKEND in .env.development to that VM URL.
      Leave APP_URL empty so /api/* is proxied by Vite (avoids browser CORS and cert issues).
      For direct browser→VM calls instead, set APP_URL to the full backend URL and fix CORS + TLS in the browser.
    -->
    <script>
      window.APP_URL = "";
      window.CONTEXT_URL = "";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
